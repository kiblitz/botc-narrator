[package]
name = "botc_server"
version = "0.1.0"
edition = "2024"
description = "Multiplayer rooms for in-person Blood on the Clocktower: phones over WebSockets, the engine as storyteller"
publish = false

[[bin]]
name = "botc-server"
path = "src/main.rs"

[dependencies]
botc_narrator = { path = ".." }
# The bridge's wire protocol.
botc_bridge = { path = "../bridge" }
# The shared Kiblitz sign-in, pinned by commit: the same one langbook pins.
account-session = { git = "https://github.com/kiblitz/account-manager", rev = "87e17156ef82c60cee1ee630cf563459e3f2fb9d" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
rand = "0.9"
# account-session installs ring; naming it here keeps the provider fixed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28"
