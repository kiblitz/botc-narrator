<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clocktower Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clocktower Simulator</h1>
    <form id="controls">
      <label>Script
        <select id="script"></select>
      </label>
      <label>Players
        <select id="players"></select>
      </label>
      <label>Seed
        <input id="seed" type="number" min="0" max="4294967295" step="1">
      </label>
      <button type="submit" id="load">Load</button>
      <button type="button" id="random">New random game</button>
      <label>View
        <select id="pov"><option value="">Storyteller (everything)</option></select>
      </label>
    </form>
  </header>

  <main>
    <section id="table-area">
      <div id="board" aria-label="Seating circle">
        <svg id="arrows" aria-hidden="true">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0 0 10 5 0 10z" fill="context-stroke"/>
            </marker>
          </defs>
        </svg>
        <div id="center">
          <div id="storyteller" title="Storyteller">📖 Storyteller</div>
          <div id="phase"></div>
        </div>
      </div>
      <div id="caption" aria-live="polite"></div>
      <div id="stepper">
        <button id="prev" title="Back (←)" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.5" height="14"/><path d="M18 5 9 12l9 7z"/></svg></button>
        <button id="next" title="Forward (→)" aria-label="Forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7z"/><rect x="16.5" y="5" width="2.5" height="14"/></svg></button>
        <span id="counter"></span>
      </div>
    </section>

    <aside>
      <section id="knowledge">
        <h2 id="knowledge-title">Click a player</h2>
        <ol id="knowledge-list"></ol>
      </section>
      <section id="log-area">
        <h2>Game log</h2>
        <ol id="log"></ol>
      </section>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
