<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clocktower Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clocktower Simulator</h1>
    <form id="controls">
      <label>Players
        <select id="players"></select>
      </label>
      <label>Seed
        <input id="seed" type="number" min="0" max="4294967295" step="1">
      </label>
      <button type="submit" id="load">Load</button>
      <button type="button" id="random">New random game</button>
      <label>View
        <select id="pov"><option value="">Storyteller (everything)</option></select>
      </label>
    </form>
  </header>

  <main>
    <section id="table-area">
      <div id="board" aria-label="Seating circle">
        <div id="center">
          <div id="phase"></div>
          <div id="caption"></div>
        </div>
      </div>
      <div id="stepper">
        <button id="first" title="First step (Home)" aria-label="First step"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="2.5" height="14"/><path d="M14 5 7 12l7 7z"/><path d="M21 5l-7 7 7 7z"/></svg></button>
        <button id="prev-phase" title="Previous phase (Shift+←)" aria-label="Previous phase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 4 12l8 7z"/><path d="M20 5l-8 7 8 7z"/></svg></button>
        <button id="prev" title="Previous step (←)" aria-label="Previous step"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.5" height="14"/><path d="M18 5 9 12l9 7z"/></svg></button>
        <button id="play" title="Play / pause (Space)" aria-label="Play"><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg><svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
        <button id="next" title="Next step (→)" aria-label="Next step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7z"/><rect x="16.5" y="5" width="2.5" height="14"/></svg></button>
        <button id="next-phase" title="Next phase (Shift+→)" aria-label="Next phase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5l8 7-8 7z"/><path d="M12 5l8 7-8 7z"/></svg></button>
        <button id="last" title="Last step (End)" aria-label="Last step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l7 7-7 7z"/><path d="M10 5l7 7-7 7z"/><rect x="17.5" y="5" width="2.5" height="14"/></svg></button>
        <input id="scrub" type="range" min="0" value="0" aria-label="Step">
        <span id="counter"></span>
      </div>
    </section>

    <aside>
      <section id="knowledge">
        <h2 id="knowledge-title">Click a player</h2>
        <ol id="knowledge-list"></ol>
      </section>
      <section id="log-area">
        <h2>Game log</h2>
        <ol id="log"></ol>
      </section>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
